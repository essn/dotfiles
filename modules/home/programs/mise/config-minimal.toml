[settings]
experimental = true

[settings.npm]
package_manager = "bun"

[tools]
# Language runtimes
node = "22.22.1"
python = "3.14.6"
ruby = "3.3"
go = "latest"
rust = "latest"

# Language tooling
bun = "1.3.11"
uv = "0.10.11"
pipx = "latest"
cargo-binstall = "1.17.7"
"npm:typescript" = "5.1.3"

# Language servers
lua-language-server = "3.17.1"
"npm:typescript-language-server" = "5.1.3"
"npm:yaml-language-server" = "1.21.0"
"pipx:python-lsp-server" = "1.14.0"
"cargo:tree-sitter-cli" = "latest"
